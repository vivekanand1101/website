<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading · Vivek Anand</title>
<meta name="description" content="What Vivek Anand reads: every post from a few people and teams, plus AI, backend and database posts from company engineering blogs, picked by Claude daily.">
<meta name="author" content="Vivek Anand">
<link rel="icon" type="image/svg+xml" href="/favicon-editorial.svg">
<link rel="canonical" href="https://anandvivek.in/reading/">
<meta property="og:title" content="Reading · Vivek Anand">
<meta property="og:url" content="https://anandvivek.in/reading/">
<meta property="og:type" content="website">
<style>
/*__SHARED_CSS__*/
  /* Reading page. Palette, header and footer come from shared/site.css. */

  /* Controls: plain text, one accent */
  .bar {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px;
    padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: 16px;
  }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .opts button {
    font: inherit; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer;
    text-underline-offset: 6px;
  }
  .opts button:hover { color: var(--text); }
  .opts button[aria-pressed="true"] { color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; }
  .right { display: flex; align-items: baseline; gap: 24px; }
  .pick { position: relative; display: inline-flex; align-items: baseline; }
  .pick select {
    appearance: none; -webkit-appearance: none; field-sizing: content;
    font: inherit; color: var(--muted); background: none; border: 0; border-radius: 0;
    padding: 0 16px 0 0; margin: 0; cursor: pointer;
  }
  .pick select:hover, .pick select.set { color: var(--text); }
  .pick select.set { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
  .pick select option, .pick select optgroup { background: var(--bg); color: var(--text); }
  .pick::after {
    content: ""; position: absolute; right: 2px; top: 50%; width: 5px; height: 5px;
    border: solid var(--muted); border-width: 0 1px 1px 0;
    transform: translateY(-75%) rotate(45deg); pointer-events: none;
  }
  .toggle-skipped {
    font: inherit; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .toggle-skipped:hover { color: var(--text); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Post list, after Writing's home page */
  .month { font-size: 16px; color: var(--muted); font-weight: 400; margin: 40px 0 8px; }
  .posts { list-style: none; padding: 0; margin: 0; }
  .posts li { display: flex; gap: 20px; padding: 6px 0; }
  .posts time {
    flex: 0 0 4.5em; color: var(--muted); font-size: 16px;
    font-variant-numeric: tabular-nums; padding-top: 2px;
  }
  .entry { min-width: 0; }
  .entry > a { color: var(--text); text-decoration: none; }
  .entry > a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 15px; line-height: 1.5; }
  .meta .fresh { color: var(--link); }
  .summary { color: var(--muted); font-size: 15px; line-height: 1.5; margin-top: 2px;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .skipped .entry > a { color: var(--muted); }
  .why { font-style: italic; }

  /* By blog */
  .blog { padding: 32px 0 8px; border-bottom: 1px solid var(--rule); }
  .blog:last-child { border-bottom: 0; }
  .blog h2 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; display: flex; gap: 12px; align-items: baseline; }
  .blog h2 a { color: var(--text); text-decoration: none; }
  .blog h2 a:hover { text-decoration: underline; }
  .blog h2 .meta { font-weight: 400; }
  .warn { color: var(--link); font-size: 15px; font-weight: 400; }

  .empty { color: var(--muted); padding: 32px 0; }
  button.more {
    display: block; margin: 32px 0 0; font: inherit; font-size: 16px; color: var(--link);
    background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }

  @media (max-width: 560px) {
    .bar { position: static; }
    .right { width: 100%; justify-content: space-between; }
    .posts li { flex-direction: column; gap: 0; padding: 8px 0; }
    .posts time { flex: none; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Same header as the home page (src/components/Navigation.tsx) and /writing/ (writings/layouts/partials/header.html). -->
  <header class="site-header">
    <a class="site-title" href="/">Vivek Anand</a>
    <nav aria-label="Main">
      <a href="/writing/">Writing</a>
      <a href="/reading/" aria-current="page">Reading</a>
      <a href="/">About</a>
    </nav>
  </header>

  <h1 class="sr-only">Reading</h1>

  <div class="bar">
    <div class="opts" id="topics" role="group" aria-label="Topic"></div>
    <div class="right">
      <label class="pick"><span class="sr">Blog</span><select id="blog"></select></label>
      <div class="opts" id="view" role="group" aria-label="View">
        <button type="button" data-view="latest">Latest</button>
        <button type="button" data-view="blogs">By blog</button>
      </div>
    </div>
  </div>

  <main id="main"></main>

  <footer class="site-footer">
    <p><button type="button" class="toggle-skipped" id="skipped"></button></p>
    <p>&copy; <span id="year"></span> Vivek Anand &middot;
      <a href="https://github.com/vivekanand1101">GitHub</a> &middot;
      <a href="https://linkedin.com/in/vivekanandxyz">LinkedIn</a> &middot;
      <a href="mailto:mail@anandvivek.in">Email</a></p>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const WEEK = 7 * 864e5;
const TOPICS = { ai: "AI", backend: "Backend", databases: "Databases" };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const state = {
  blog: "all", topic: "all", limit: 100,
  view: store.get("view") === "blogs" ? "blogs" : "latest",
  skipped: store.get("skipped") === "1",
};
const all = DATA.blogs.flatMap(b => b.posts.map(p => ({ ...p, blog: b })))
  .sort((a, b) => b.date.localeCompare(a.date));
const relevant = p => !p.blog.filter || !!(p.verdict && p.verdict.relevant);
const isFresh = p => Date.now() - Date.parse(p.date) < WEEK;
const pool = () => all.filter(p => relevant(p) || (state.skipped && p.verdict));
const topicsOf = p => (p.verdict && p.verdict.topics) || [];
const byTopic = (p, t = state.topic) => t === "all" || topicsOf(p).includes(t);
const byBlog = (p, b = state.blog) =>
  b === "all" || (b === "people" ? !p.blog.filter : b === "companies" ? p.blog.filter : p.blog.id === b);

const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter(k => k != null));
  return n;
};
const safeUrl = u => /^https?:\/\//.test(u) ? u : "#";
// Dates read like Writing's: "Oct 06", grouped under "October 2026".
const fmtMonth = d => new Date(d).toLocaleDateString("en-US", { month: "long", year: "numeric" });
const fmtDay = d => new Date(d).toLocaleDateString("en-US", { month: "short", day: "2-digit" });
const sep = () => document.createTextNode(" · ");

function postEl(p, { showSource = true, showSummary = true } = {}) {
  const ok = relevant(p);
  const bits = [
    showSource ? p.blog.name : null,
    p.label || null,
    topicsOf(p).map(t => TOPICS[t] || t).join(", ") || null,
    ok ? null : "skipped",
  ].filter(Boolean);
  const fresh = ok && (isFresh(p) ? "this week" : null);
  const meta = el("div", { className: "meta" });
  bits.forEach((b, i) => { if (i) meta.append(sep()); meta.append(b); });
  if (fresh) { if (bits.length) meta.append(sep()); meta.append(el("span", { className: "fresh", textContent: fresh })); }
  const reason = p.verdict && p.verdict.reason;
  return el("li", { className: ok ? "" : "skipped" },
    el("time", { dateTime: p.date.slice(0, 10), textContent: fmtDay(p.date) }),
    el("div", { className: "entry" },
      el("a", { href: safeUrl(p.url), target: "_blank", rel: "noopener", title: reason || "", textContent: p.title }),
      meta,
      showSummary && p.summary && p.summary !== p.title ? el("div", { className: "summary", textContent: p.summary }) : null,
      !ok && reason ? el("div", { className: "meta why", textContent: reason }) : null));
}

function renderFilters() {
  const topics = [["all", "All"], ...Object.entries(TOPICS), ["picks", "Great reads"]];
  document.getElementById("topics").replaceChildren(...topics.map(([id, name]) => {
    const b = el("button", { type: "button", textContent: name, onclick: () => { state.topic = id; render(); } });
    b.setAttribute("aria-pressed", state.topic === id);
    return b;
  }));
  const opt = (value, label) => el("option", { value, textContent: label, selected: state.blog === value });
  const group = (label, blogs) => el("optgroup", { label }, ...blogs.map(b => opt(b.id, b.name)));
  document.getElementById("blog").replaceChildren(
    opt("all", "All blogs"), opt("people", "Full-feed blogs"), opt("companies", "Filtered blogs"),
    group("Full feed", DATA.blogs.filter(b => !b.filter)),
    group("Filtered by Claude", DATA.blogs.filter(b => b.filter)));
}

function renderLatest(main, list) {
  if (!list.length) return main.append(el("p", { className: "empty", textContent: "Nothing matches yet." }));
  let month = "", ul;
  for (const p of list.slice(0, state.limit)) {
    const m = fmtMonth(p.date);
    if (m !== month) {
      main.append(el("h2", { className: "month", textContent: m }), ul = el("ul", { className: "posts" }));
      month = m;
    }
    ul.append(postEl(p));
  }
  if (list.length > state.limit) {
    main.append(el("button", { type: "button", className: "more", textContent: `Show ${Math.min(100, list.length - state.limit)} more`,
      onclick: () => { state.limit += 100; render(); } }));
  }
}

function renderBlogs(main, list) {
  for (const b of [...DATA.blogs].sort((x, y) => x.filter - y.filter)) {
    if (!byBlog({ blog: b })) continue;
    const ps = list.filter(p => p.blog.id === b.id).slice(0, state.blog === "all" ? 5 : 40);
    main.append(el("section", { className: "blog" },
      el("h2", {}, el("a", { href: safeUrl(b.home), target: "_blank", rel: "noopener", textContent: b.name }),
        el("span", { className: "meta", textContent: b.filter ? "topic-filtered" : "full feed" }),
        b.ok ? null : el("span", { className: "warn", textContent: "feed error" })),
      ps.length ? el("ul", { className: "posts" }, ...ps.map(p => postEl(p, { showSource: false, showSummary: false })))
        : el("p", { className: "empty", textContent: "Nothing on these topics yet." })));
  }
}

function renderPicks(main) {
  if (!DATA.picks.length) return main.append(el("p", { className: "empty", textContent: "Nothing here yet." }));
  main.append(el("ul", { className: "posts" }, ...DATA.picks.map(p => el("li", {},
    el("time", { dateTime: p.added, textContent: fmtDay(p.added) }),
    el("div", { className: "entry" },
      el("a", { href: safeUrl(p.url), target: "_blank", rel: "noopener", textContent: p.title }),
      el("div", { className: "meta", textContent: [p.author, new URL(p.url).hostname].filter(Boolean).join(" \u00b7 ") }))))));
}

function render() {
  if (render.key !== state.blog + state.topic + state.skipped) { state.limit = 100; render.key = state.blog + state.topic + state.skipped; }
  store.set("view", state.view);
  store.set("skipped", state.skipped ? "1" : "0");
  renderFilters();
  document.querySelectorAll("#view button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  const skippedCount = all.filter(p => p.verdict && !relevant(p)).length;
  document.getElementById("skipped").textContent = state.skipped ? "Hide skipped posts." : `Show the ${skippedCount} skipped posts.`;
  document.getElementById("blog").classList.toggle("set", state.blog !== "all");
  const list = pool().filter(p => state.topic !== "picks" && byTopic(p) && byBlog(p));
  const main = document.getElementById("main");
  main.replaceChildren();
  const picks = state.topic === "picks";
  document.querySelector(".pick").hidden = picks;
  document.getElementById("view").hidden = picks;
  (picks ? renderPicks : state.view === "blogs" ? renderBlogs : renderLatest)(main, list);
}

document.querySelectorAll("#view button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
document.getElementById("blog").onchange = e => { state.blog = e.target.value; render(); };
document.getElementById("skipped").onclick = () => { state.skipped = !state.skipped; render(); scrollTo({ top: 0 }); };
document.getElementById("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>

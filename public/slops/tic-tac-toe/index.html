<!doctype html>
<html lang="en"><head><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.typesafe.ai; object-src 'none'; base-uri 'none'; form-action 'none'"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross & Circle — Play Jev</title>
<link rel="icon" type="image/svg+xml" href="./favicon-editorial.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./key-settings.css"></head><body>
<main><section class="game" aria-label="Tic-tac-toe game"><div class="match"><span>You <b>×</b></span><span class="versus">versus</span><span><b>○</b> <span id="opponent">Jev</span></span></div><div class="game-top"><div class="status" id="status" role="status" aria-live="polite">Your move.</div><span class="round" id="round">Round 01</span></div><div class="board" id="board" aria-label="Game board"></div><div class="game-bottom"><span class="hint" id="hint" hidden>Pick a square to play X</span><button class="reset" id="starter">AI starts</button><button class="reset" id="reset">↻ &nbsp; New round</button></div><p class="error" id="error" role="alert" hidden></p><div class="scores"><div><strong class="you" id="wins">0</strong><small>YOU</small></div><div><strong id="draws">0</strong><small>DRAWS</small></div><div><strong class="ai-score" id="losses">0</strong><small id="ai-label">JEV</small></div></div><span id="connection" hidden></span><span id="badge" hidden></span></section></main>
<dialog id="result"><h2 id="result-title"></h2><p id="result-message"></p><form method="dialog"><button>Got it</button></form></dialog>
<script type="module" src="./game.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://tic-tac-toe.vivekanand1101.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tic-tac-toe · Vivek Anand</title>
  <meta name="description" content="Play tic-tac-toe with your own Jev key, or against the built-in browser opponent.">
  <link rel="canonical" href="https://anandvivek.in/slops/tic-tac-toe/">
  <link rel="icon" type="image/svg+xml" href="./favicon-editorial.svg">
  <link rel="stylesheet" href="./site-shell.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./key-settings.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="site-title" href="https://anandvivek.in/">Vivek Anand</a>
    <nav aria-label="Main">
      <a href="https://anandvivek.in/writing/">Writing</a>
      <a href="https://anandvivek.in/reading/">Reading</a>
      <a href="https://anandvivek.in/slops/" aria-current="page">Slops</a>
      <a href="https://anandvivek.in/">About</a>
    </nav>
  </header>
  <main>
    <div class="page-heading">
      <div><h1>Tic-tac-toe</h1><p class="page-intro">Three in a row. You play ×.</p></div>
      <div id="key-controls"></div>
    </div>
    <section class="game" aria-label="Tic-tac-toe game">
      <div class="match"><span>You <b>×</b></span><span class="versus">versus</span><span><b>○</b> <span id="opponent">Jev</span></span></div>
      <div class="game-top"><div class="status" id="status" role="status" aria-live="polite">Your move.</div><span class="round" id="round">Round 01</span></div>
      <div class="board" id="board" aria-label="Game board"></div>
      <div class="game-bottom"><span class="hint" id="hint" hidden>Pick a square to play X</span><button class="reset" id="starter">AI starts</button><button class="reset" id="reset">You start</button></div>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="scores"><div><strong class="you" id="wins">0</strong><small>YOU</small></div><div><strong id="draws">0</strong><small>DRAWS</small></div><div><strong class="ai-score" id="losses">0</strong><small id="ai-label">JEV</small></div></div>
      <span id="connection" hidden></span><span id="badge" hidden></span>
    </section>
  </main>
  <footer class="site-footer">© 2026 Vivek Anand · <a href="https://github.com/vivekanand1101">GitHub</a> · <a href="https://linkedin.com/in/vivekanandxyz">LinkedIn</a> · <a href="mailto:mail@anandvivek.in">Email</a></footer>
</div>
<dialog id="result"><h2 id="result-title"></h2><p id="result-message"></p><form method="dialog"><button>Got it</button></form></dialog>
<script type="module" src="./game.js"></script>
</body>
</html>
